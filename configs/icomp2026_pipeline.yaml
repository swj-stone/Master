protocol_version: "1.0"

datasets:
  - spambase
  - madelon
  - isolet
  - gisette
  - credit_card_fraud
  - crimedata
  - abalone

seeds: [42, 123, 456, 789, 1024]
backend: cpu

execution:
  mode: grouped_nested_v1
  cache_schema: coalition_utility_v1
  checkpoint_every_fits: 50
  progress_every_seconds: 30

model:
  n_estimators: 100
  max_depth: 4
  learning_rate: 0.1
  n_jobs: 1

alpha:
  default: 0.95
  grid: [0.85, 0.90, 0.95, 0.99]

estimator:
  methods: [exact, random_mc, mi_correlation_guided, hybrid]
  budgets: [10, 25, 50]
  budgets_by_dataset:
    spambase: [2, 5, 10, 25]
    madelon: [2, 5, 10, 25]
    isolet: [2, 5, 10]
    gisette: [2, 5, 10, 25]
    credit_card_fraud: [2, 5, 10, 25]
    crimedata: [2, 5, 10, 25]
    abalone: [2, 5, 10, 25]
  exact_max_features: 16

removal:
  controls:
    - full
    - minppi
    - shap_bottom
    - minshap_bottom
    - banzhaf_bottom
    - random_matched
  random_repeats: 30
  classification_noninferiority_margin: 0.005
  regression_noninferiority_margin: 0.01

nsga2:
  variants: [full, minppi_prefilter]
  population: 40
  evaluations: 800
  ref_point: [1.1, 1.1]

ablations:
  utility: [accuracy, ovr_auc]
  guidance: [random, mi, correlation, mi_correlation]
  dispatcher: [exact, random_mc, mi_correlation_guided, hybrid]

stage_scopes:
  alpha:
    datasets:
      - spambase
      - madelon
      - isolet
      - gisette
      - credit_card_fraud
      - crimedata
      - abalone
    seeds: [42]
  ablation:
    datasets:
      - madelon
      - isolet
      - credit_card_fraud
      - abalone
    seeds: [42]

smoke:
  datasets: [spambase, abalone]
  seeds: [42]
  estimator_budgets: [2]
  random_repeats: 2
  nsga2_population: 4
  nsga2_evaluations: 8
