# ShapG top-k sweep — correlated-neighbor budget for Algorithm B
#
# Purpose: measure how the number of ShapG-correlated neighbours used in
# Algorithm B's adversarial search affects harmful-feature detection rate
# and downstream MOFS-MinPPI performance.
#
# Algorithm B (§4.3.2): C ← ShapG-neighbors(i, G_corr, top-k)
# Larger k → wider search around correlated features → higher detection
# rate for sparse harmful events, but more evaluations.
#
# Key question: is the default k=10 sufficient, or does a larger
# neighbourhood meaningfully improve MinPPI estimation?
#
# Evaluation (§6):
#   - Harmful-feature detection rate (|MinPPI = -1| / n)
#   - MinPPI class distribution stability across k levels
#   - Algorithm B evaluation count vs detection rate trade-off
#   - MOFS-MinPPI Pareto-front HV at each k

ablation:
  name: "shapg_k_sweep"
  description: "ShapG neighbor budget: how top-k affects Algorithm B detection"
  type: "sweep"
  parameter: "shapg_top_k"
  values: [5, 10, 15, 20, 30]

minppi:
  method: "shapg_guided"
  K: 200
  K_adv: 30
  alpha: 0.95
  seed: 42

nsga2:
  pop_size: 30
  generations: 20
  beta: 1.0
  p_base: 0.1
  seed: 42

datasets:
  - prefix: "spambase"
    target: "is_spam"
    multiclass: false
  - prefix: "madelon"
    target: "label"
    multiclass: false
  - prefix: "isolet"
    target: "letter"
    multiclass: true
  - prefix: "gisette"
    target: "label"
    multiclass: false
  - prefix: "credit_card_fraud"
    target: "Class"
    multiclass: false

evaluation:
  topk_kpis: [1, 3, 5, 10, 20, 50]
  auc_loss_thresholds: [0.01, 0.03, 0.05]

output:
  log_dir: "results/logs"
  table_dir: "results/tables"
