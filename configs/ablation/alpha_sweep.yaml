# Alpha sensitivity sweep — quota parameter α ∈ {0.80, 0.85, 0.90, 0.95, 0.99}
#
# Purpose: measure how MinPPI classification stability and downstream
# MOFS-MinPPI performance vary with the voting-game threshold α.
#
# Higher α → fewer winning coalitions → more features classified as harmful
# → MinPPI-guided operators become more selective.
#
# Evaluation (§6):
#   - MinPPI class distribution  (|decisive|, |neutral|, |harmful|)
#   - MOFS-MinPPI Pareto-front hypervolume (HV)
#   - Compression rate at 1% / 3% / 5% AUC loss
#   - Top-1 feature stability (Jaccard between adjacent α levels)

ablation:
  name: "alpha_sweep"
  description: "Quota sensitivity: how α affects MinPPI classification and FS quality"
  type: "sweep"
  parameter: "alpha"
  values: [0.80, 0.85, 0.90, 0.95, 0.99]

minppi:
  method: "shapg_guided"
  K: 200
  K_adv: 30
  seed: 42

nsga2:
  pop_size: 30
  generations: 20
  beta: 1.0          # fixed moderate guidance
  p_base: 0.1
  seed: 42

datasets:
  - prefix: "spambase"
    target: "is_spam"
    multiclass: false
  - prefix: "madelon"
    target: "label"
    multiclass: false
  - prefix: "isolet"
    target: "letter"
    multiclass: true
  - prefix: "gisette"
    target: "label"
    multiclass: false
  - prefix: "credit_card_fraud"
    target: "Class"
    multiclass: false

evaluation:
  topk_kpis: [1, 3, 5, 10, 20, 50]
  auc_loss_thresholds: [0.01, 0.03, 0.05]   # 1%, 3%, 5% AUC loss
  statistical_test: "friedman_nemenyi"

output:
  log_dir: "results/logs"
  table_dir: "results/tables"
