# Preprocessing configuration for Credit-Card-Fraud (OpenML, originally Kaggle)
# Dataset: 29 features, 284807 samples, highly imbalanced binary classification

dataset:
  name: "Credit-Card-Fraud"
  source: "openml"
  openml_name: "creditcard"
  n_features: 29
  n_samples: 284807
  classes: 2
  target_name: "Class"

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  raw_filename: "credit_card_fraud.csv"
  file_prefix: "credit_card_fraud"

feature_engineering:
  drop_duplicates: true
  variance_threshold: 0.01
  max_features: 100000

preprocessing:
  standardize: true
  shuffle: true

split:
  feature_seed: 42
  seeds: [42, 123, 456, 789, 1024]
  test_size: 0.2
  val_size: 0.25
  stratify: true
