# Preprocessing configuration for ISOLET (OpenML, originally UCI)
# Dataset: 617 features, 7797 samples, 26-class classification (letter speech)

dataset:
  name: "ISOLET"
  source: "openml"
  openml_name: "isolet"
  openml_version: 1
  n_features: 617
  n_samples: 7797
  classes: 26
  target_name: "letter"

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  raw_filename: "isolet.csv"
  file_prefix: "isolet"

feature_engineering:
  drop_duplicates: true
  variance_threshold: 0.005
  max_features: 100000

preprocessing:
  standardize: true
  shuffle: true

split:
  feature_seed: 42
  seeds: [42, 123, 456, 789, 1024]
  test_size: 0.2
  val_size: 0.25
  stratify: true
