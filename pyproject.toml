[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minppi-mofs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.11.0",
    "networkx==3.6.1",
    "numba==0.66.0",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "shap==0.52.0",
    "statsmodels==0.14.6",
    "tqdm==4.68.3",
    "xgboost==3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.15.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/minppi_mofs/__init__.py" = ["E402"]  # xgboost monkey-patch before subpackage imports
